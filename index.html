<!doctype html>
<html lang="bn">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proshika HRMS - ব্যবহার নির্দেশিকা By Rohan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/chat.css" />
</head>

<body>
  <header class="header">

    <!-- HEADER CENTER CONTENT -->
    <div class="header-content">
      <img src="assets/images/logo-placeholder.png" alt="Proshika Logo" class="header-logo" />
      <h1 class="header-title">
        <span class="textcolor-one">PROSHIKA HRMS</span>
        <span class="textcolor-two"> - ব্যবহার নির্দেশিকা</span>
      </h1>

    </div>

    <!-- RIGHT SIDE ACTIONS -->
    <div class="header-actions">

      <!-- SEARCH BAR -->
      <div class="header-search-wrapper" id="searchWrapper">

        <div class="search-btn" onclick="toggleSearch()">
          🔍
        </div>

        <input type="text" id="pageSearch" placeholder="এখানে খুঁজুন..." oninput="liveSearchAndHighlight()" />

        <div id="search-controls">

          <span id="search-count">
            0/0
          </span>

          <div class="search-nav-buttons">

            <span onclick="navigateSearch(-1)">
              ▲
            </span>

            <span onclick="navigateSearch(1)">
              ▼
            </span>

          </div>

        </div>

      </div>

      <!-- PDF DOWNLOAD BUTTON -->
      <button class="pdf-download-btn" onclick="downloadPDF()">
        📄 PDF
      </button>

    </div>

  </header>



  <!-- Main content area with sidebar and content sections -->
  <div class="container">
    <aside id="sidebar-container" class="sidebar"></aside>
    <main id="main-container" class="main-content"></main>
  </div>
  <!--footer section-->
  <footer class="footer">
    <div class="footer-left">
      <small>© 2025-2026 All Rights Reserved, Pirthe Limited</small>
    </div>
    <div class="footer-right">
      <small>
        <span style="color: #ddd">কারিগরি সহায়তায় - </span>
        <a href="https://www.pirthe.com/" target="_blank" style="color: #fd7113">পৃথ্বী লিমিটেড</a>
      </small>
    </div>
  </footer>
  <!--footer section end-->

  <!--back to top button-->
  <button id="backToTop" title="শুরুতে যান">🡹</button>





  <!-- AI Chat Launcher -->
  <div id="chat-launcher" onclick="toggleChat()">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="white">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </div>

  <div id="ai-chat-container" style="display: none; flex-direction: column;">
    <div
      style="background: #1a73e8; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-radius: 12px 12px 0 0;">
      <span>HRMS AI</span>
      <span onclick="toggleChat()" style="cursor: pointer; font-size: 24px; line-height: 1;">×</span>
    </div>

    <div id="chat-history"
      style="flex: 1; overflow-y: auto; padding: 15px; background: #f8f9fa; display: flex; flex-direction: column; gap: 10px;">
    </div>

    <div
      style="padding: 12px; display: flex; border-top: 1px solid #eee; background: white; border-radius: 0 0 12px 12px;">
      <input type="text" id="user-input" placeholder="আপনার প্রশ্নটি এখানে লিখুন..."
        style="flex: 1; border: none; outline: none; padding: 8px; font-size: 14px;" />
      <button onclick="askme()"
        style="border: none; background: none; cursor: pointer; color: #1a73e8; font-weight: bold; padding: 0 10px;">Send</button>
    </div>
  </div>



  <!-- ==============================================================
       💡 স্মার্ট পপআপ সেকশন (Search & AI Chat Tooltip) শুরু
       ============================================================== -->
  <div id="smart-popups-container">

    <!-- ১. Search Tooltip -->
    <div id="search-magic-tooltip" style="position: fixed; top: 70px; right: 25px; 
          background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); color: #2563eb; 
          padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: bold; 
          box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 99999; 
          opacity: 0; visibility: hidden; transition: all 0.4s ease; transform: translateY(-10px);
          border: 1px solid rgba(37, 99, 235, 0.2);">
      👋 আপনি কি কিছু খুঁজছেন?
      <span onclick="hideSearchTooltip()"
        style="margin-left: 12px; cursor: pointer; font-size: 18px; font-weight: bold; color: #ef4444; transition: 0.2s;"
        title="বন্ধ করুন">×</span>
    </div>

    <!-- ২. AI Chat Tooltip -->
    <div id="ai-magic-tooltip" style="position: fixed; bottom: 85px; right: 25px; 
          background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); color: #1a73e8; 
          padding: 10px 16px; border-radius: 12px 12px 0 12px; font-size: 13px; font-weight: bold; 
          box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 99998; 
          opacity: 0; visibility: hidden; transition: all 0.4s ease; transform: translateY(10px);
          border: 1px solid rgba(26, 115, 232, 0.2);">
      🤖 কোনো সাহায্য লাগবে? আমাকে জিজ্ঞেস করুন!
      <span onclick="hideAiTooltip()"
        style="margin-left: 12px; cursor: pointer; font-size: 18px; font-weight: bold; color: #ef4444; transition: 0.2s;"
        title="বন্ধ করুন">×</span>
    </div>

  </div>

  <script>
    // এলিমেন্টগুলো ধরা হচ্ছে
    var searchTooltip = document.getElementById("search-magic-tooltip");
    var aiTooltip = document.getElementById("ai-magic-tooltip");

    var searchWrapper = document.getElementById("searchWrapper");
    var aiChatContainer = document.getElementById("ai-chat-container");
    var aiChatLauncher = document.getElementById("chat-launcher");

    // টাইমার এবং ট্র্যাকার ভ্যারিয়েবল
    var activePopup = null; // কোন পপআপ স্ক্রিনে আছে তা ট্র্যাক করবে (যাতে ২টি একসাথে না আসে)
    var searchBounce, aiBounce;
    var searchHideTimer, aiHideTimer;

    // ==========================================
    // 🔍 Search Tooltip Logic
    // ==========================================
    function hideSearchTooltip() {
      if (searchTooltip) {
        searchTooltip.style.opacity = "0";
        searchTooltip.style.visibility = "hidden";
        clearInterval(searchBounce);
        if (activePopup === 'search') activePopup = null; // স্ক্রিন ক্লিয়ার করা হলো
      }
    }

    function showSearchTooltip() {
      // যদি AI পপআপ স্ক্রিনে থাকে, তবে ৬ সেকেন্ড অপেক্ষা করে আবার চেষ্টা করবে
      if (activePopup === 'ai') {
        setTimeout(showSearchTooltip, 6000);
        return;
      }
      // যদি আগে থেকেই সার্চ বক্স খোলা থাকে, তবে আর দেখাবে না
      if (searchWrapper && searchWrapper.classList.contains('active')) return;

      if (searchTooltip) {
        activePopup = 'search'; // সার্চ পপআপ স্ক্রিনে আসলো
        searchTooltip.style.opacity = "1";
        searchTooltip.style.visibility = "visible";
        searchTooltip.style.transform = "translateY(0px)";

        clearInterval(searchBounce);
        clearTimeout(searchHideTimer);

        searchBounce = setInterval(function () {
          if (searchTooltip.style.opacity === "1") {
            searchTooltip.style.transform = searchTooltip.style.transform === "translateY(0px)" ? "translateY(-5px)" : "translateY(0px)";
          }
        }, 1000);

        // ৫ সেকেন্ড পর চলে যাবে
        searchHideTimer = setTimeout(hideSearchTooltip, 5000);
      }
    }

    // ==========================================
    // 🤖 AI Tooltip Logic
    // ==========================================
    function hideAiTooltip() {
      if (aiTooltip) {
        aiTooltip.style.opacity = "0";
        aiTooltip.style.visibility = "hidden";
        clearInterval(aiBounce);
        if (activePopup === 'ai') activePopup = null; // স্ক্রিন ক্লিয়ার করা হলো
      }
    }

    function showAiTooltip() {
      // যদি Search পপআপ স্ক্রিনে থাকে, তবে ৬ সেকেন্ড অপেক্ষা করে আবার চেষ্টা করবে
      if (activePopup === 'search') {
        setTimeout(showAiTooltip, 6000);
        return;
      }
      // যদি আগে থেকেই চ্যাট বক্স খোলা থাকে, তবে আর দেখাবে না
      if (aiChatContainer && aiChatContainer.style.display !== 'none') return;

      if (aiTooltip) {
        activePopup = 'ai'; // AI পপআপ স্ক্রিনে আসলো
        aiTooltip.style.opacity = "1";
        aiTooltip.style.visibility = "visible";
        aiTooltip.style.transform = "translateY(0px)";

        clearInterval(aiBounce);
        clearTimeout(aiHideTimer);

        aiBounce = setInterval(function () {
          if (aiTooltip.style.opacity === "1") {
            aiTooltip.style.transform = aiTooltip.style.transform === "translateY(0px)" ? "translateY(-5px)" : "translateY(0px)";
          }
        }, 1000);

        // ৫ সেকেন্ড পর চলে যাবে
        aiHideTimer = setTimeout(hideAiTooltip, 5000);
      }
    }

    // ==========================================
    // ⏱️ টাইমিং সেটআপ (Timings)
    // ==========================================
    // ১. পেজ লোড হওয়ার ৩ সেকেন্ড পর Search পপআপ আসবে
    setTimeout(showSearchTooltip, 3000);

    // ২. পেজ লোড হওয়ার ১২ সেকেন্ড পর AI পপআপ আসবে (Search চলে যাওয়ার পর)
    setTimeout(showAiTooltip, 12000);

    // ৩. প্রতি ৪৫ সেকেন্ড পর পর Search পপআপ রিমাইন্ডার দেবে
    setInterval(showSearchTooltip, 45000);

    // ৪. প্রতি ৬০ সেকেন্ড (১ মিনিট) পর পর AI পপআপ রিমাইন্ডার দেবে
    setInterval(showAiTooltip, 60000);

    // ==========================================
    // 🖱️ ক্লিক ইভেন্ট (ক্লিক করলেই বন্ধ হবে)
    // ==========================================
    window.addEventListener('DOMContentLoaded', function () {
      // Search Events
      var searchBtn = document.querySelector('.search-btn');
      var searchInput = document.getElementById('pageSearch');
      if (searchBtn) searchBtn.addEventListener('click', hideSearchTooltip);
      if (searchInput) searchInput.addEventListener('focus', hideSearchTooltip);
      if (searchWrapper) searchWrapper.addEventListener('click', hideSearchTooltip);

      // AI Events
      if (aiChatLauncher) aiChatLauncher.addEventListener('click', hideAiTooltip);
    });
  </script>
  <!-- ==============================================================
       💡 স্মার্ট পপআপ সেকশন (Search & AI Chat Tooltip) শেষ
       ============================================================== -->

  <!-- আপনার এক্সটার্নাল ফাইলগুলো এর নিচে থাকবে -->
  <script src="assets/js/script.js"></script>
  <script src="assets/js/chat.js"></script>
  <script src="assets/js/pdf-download.js"></script>


</body>

</html>
